<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>課題です</title>
    <style>
        div {
            position: absolute;
            left: 50px;
            top: 50px;
            width: 150px;
            height: 150px;
            background-color: skyblue;
        }
        .rotate {
            transform: rotate(20deg); /* rotateZ(45deg) と等価 */
}
    </style>
</head>

<body>
    <div class="rotate">回転します</div>
</body>

</html>
